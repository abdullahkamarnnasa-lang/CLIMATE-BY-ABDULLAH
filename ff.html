<html lang="en">

<head>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080808;
            color: white;
        }

        /* HEADER */

        header {
            background: linear-gradient(90deg, #111, #ff5a00, #111);
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 0 25px #ff5a00;
        }

        header h1 {
            font-size: 40px;
            text-shadow: 0 0 12px #ff5a00;
        }

        header p {
            margin-top: 8px;
            color: #eee;
        }

        /* SEARCH */

        .search-box {
            width: 90%;
            max-width: 750px;
            margin: 35px auto;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 17px;
            background: #151515;
            color: white;
            border: 2px solid #ff5a00;
            border-radius: 12px 0 0 12px;
            outline: none;
            font-size: 17px;
        }

        .search-box button {
            padding: 0 25px;
            border: none;
            background: #ff5a00;
            color: white;
            font-size: 17px;
            cursor: pointer;
            border-radius: 0 12px 12px 0;
        }

        .search-box button:hover {
            background: #ff7b35;
        }

        /* CATEGORIES */

        .categories {
            text-align: center;
            margin-bottom: 30px;
        }

        .categories button {
            padding: 10px 18px;
            margin: 5px;
            border: 1px solid #ff5a00;
            border-radius: 20px;
            background: #151515;
            color: white;
            cursor: pointer;
        }

        .categories button:hover,
        .categories button.active {
            background: #ff5a00;
        }

        /* CONTAINER */

        .container {
            width: 92%;
            max-width: 1250px;
            margin: auto;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* CARD */

        .card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #ff5a00;
            box-shadow: 0 0 20px rgba(255, 90, 0, 0.5);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #222;
        }

        .card-content {
            padding: 18px;
        }

        .card h2 {
            color: #ff7130;
            margin-bottom: 8px;
        }

        .card p {
            color: #bbb;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            background: #252525;
            color: #ff7130;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .ability {
            background: #090909;
            border: 1px dashed #ff5a00;
            padding: 12px;
            border-radius: 8px;
            color: #ddd;
            margin-top: 10px;
        }

        .ability strong {
            color: #ff7130;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: #ff5a00;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .copy-btn:hover {
            background: #ff7b35;
        }

        /* NO RESULT */

        #noResult {
            display: none;
            text-align: center;
            padding: 50px;
            color: #ff5a00;
            font-size: 22px;
        }

        /* FOOTER */

        footer {
            background: #111;
            text-align: center;
            padding: 25px;
            border-top: 1px solid #333;
        }

        footer span {
            color: #ff5a00;
            font-weight: bold;
        }

        /* MOBILE */

        @media(max-width:600px) {

            header h1 {
                font-size: 28px;
            }

            .search-box {
                width: 94%;
            }

            .card img {
                height: 170px;
            }

        }

    </style>

    /*
    ==========================================
    LOAD CARDS
    ==========================================
    */

    function loadItems() {

        const grid =
            document.getElementById("itemGrid");

        grid.innerHTML = "";


        items.forEach(function(item, index) {

            const card =
                document.createElement("div");

            card.className = "card";

            card.dataset.category =
                item.category;

            card.dataset.name =
                item.name.toLowerCase();

            card.dataset.description =
                item.description.toLowerCase();

            card.innerHTML = `

                <img
                    src="${item.image}"
                    alt="${item.name}"
                    onerror="this.onerror=null; this.src='https://placehold.co/900x500/222/ffffff?text=Free+Fire';"
                >

                <div class="card-content">

                    <h2>
                        ${item.name}
                    </h2>

                    <span class="tag">
                        ${item.type}
                    </span>

                    <p>
                        ${item.description}
                    </p>

                    <div class="ability">

                        <strong>
                            Info:
                        </strong>

                        <br>

                        ${item.ability}

                    </div>

                    <button
                        class="copy-btn"
                        onclick="copyInfo(${index})"
                    >
                        Copy Information
                    </button>

                </div>

            `;

            grid.appendChild(card);

        });

    }


    /*
    ==========================================
    SEARCH
    ==========================================
    */

    function searchItems() {

        let input =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

        let cards =
            document.querySelectorAll(".card");

        let found = 0;


        cards.forEach(function(card) {

            let name =
                card.dataset.name;

            let description =
                card.dataset.description;

            let category =
                card.dataset.category;


            let searchMatch =
                name.includes(input) ||
                description.includes(input);


            let categoryMatch =
                currentCategory === "all" ||
                category === currentCategory;


            if (searchMatch && categoryMatch) {

                card.style.display = "block";

                found++;

            } else {

                card.style.display = "none";

            }

        });


        document.getElementById("noResult").style.display =
            found === 0 ? "block" : "none";

    }


    /*
    ==========================================
    CATEGORY FILTER
    ==========================================
    */

    function filterCategory(category, button) {

        currentCategory = category;


        document
            .querySelectorAll(".categories button")
            .forEach(function(btn) {

                btn.classList.remove("active");

            });


        button.classList.add("active");

        searchItems();

    }


    /*
    ==========================================
    COPY INFORMATION
    ==========================================
    */

    function copyInfo(index) {

        const item = items[index];


        const text =

`Free Fire Information

Name: ${item.name}

Type: ${item.type}

Description:
${item.description}

Info:
${item.ability}`;


        navigator.clipboard
            .writeText(text)
            .then(function() {

                alert(
                    item.name +
                    " information copied!"
                );

            })
            .catch(function() {

                alert(text);

            });

    }

    ==========================================
