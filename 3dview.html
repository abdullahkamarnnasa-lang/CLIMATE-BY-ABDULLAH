<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmos Explorer — Interactive Solar System</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000;color:#fff}
#app{position:fixed;inset:0}canvas{display:block}
#top{
 position:fixed;left:18px;right:18px;top:14px;z-index:20;display:flex;align-items:center;
 justify-content:space-between;pointer-events:none
}
.brand{pointer-events:auto;background:rgba(7,10,18,.78);backdrop-filter:blur(14px);border:1px solid #ffffff18;border-radius:16px;padding:12px 16px}
.brand b{font-size:18px}.brand small{display:block;color:#9da8bd;margin-top:3px}
#search{pointer-events:auto;width:280px;background:#080d17;color:white;border:1px solid #ffffff20;border-radius:12px;padding:12px;outline:none}
.panel{
 position:fixed;z-index:20;background:rgba(7,10,18,.82);backdrop-filter:blur(16px);
 border:1px solid #ffffff16;box-shadow:0 18px 50px #0008;border-radius:18px
}
#left{left:18px;top:105px;width:225px;padding:12px;max-height:calc(100vh - 180px);overflow:auto}
#right{right:18px;top:105px;width:290px;padding:18px;display:none}
#bottom{left:50%;bottom:18px;transform:translateX(-50%);padding:10px 15px;white-space:nowrap}
button,.chip{
 border:1px solid #ffffff18;background:#101724;color:#e9edf5;border-radius:10px;padding:9px 11px;cursor:pointer;
 transition:.18s
}
button:hover,.chip:hover{background:#1b2a3e;border-color:#5e7ca8}
.planetBtn{display:flex;width:100%;justify-content:space-between;margin:5px 0;text-align:left}
.planetBtn span{color:#8e9bb0;font-size:11px}
h2{margin:0 0 5px;font-size:25px}h3{margin:17px 0 7px;color:#9ecbff}
p{color:#aeb8c9;line-height:1.55;font-size:13px}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff0b;color:#b8c2d3;font-size:13px}
.stat b{color:#fff}
#close{float:right}
#speed{width:120px;vertical-align:middle}
#hint{color:#8290a6;font-size:11px}
#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#02040a}
.loadbox{text-align:center;color:#cfd7e7}.spinner{width:35px;height:35px;border:3px solid #ffffff20;border-top-color:#9ecbff;border-radius:50%;animation:spin 1s linear infinite;margin:auto auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:750px){
 #left{width:185px;left:8px;top:80px}.brand small{display:none}#search{width:150px}
 #right{right:8px;width:235px}.bottomText{display:none}#bottom{padding:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="loadbox"><div class="spinner"></div><b>Building the Solar System…</b><div style="margin-top:7px;font-size:12px">3D scene loading</div></div></div>

<div id="top">
 <div class="brand">🚀 <b>Cosmos Explorer</b><small>Interactive Solar System</small></div>
 <input id="search" placeholder="Search planet…">
</div>

<div id="left" class="panel">
 <b style="color:#9ecbff">CELESTIAL BODIES</b>
 <div id="planetList"></div>
 <hr style="border:0;border-top:1px solid #ffffff10;margin:13px 0">
 <button id="homeBtn" style="width:100%">☀️ Reset View</button>
 <button id="orbitsBtn" style="width:100%;margin-top:6px">◉ Hide Orbits</button>
 <button id="labelsBtn" style="width:100%;margin-top:6px">🏷️ Hide Labels</button>
</div>

<div id="right" class="panel">
 <button id="close">×</button>
 <h2 id="infoName">Earth</h2>
 <p id="infoType"></p>
 <div class="stat"><span>Diameter</span><b id="diameter">—</b></div>
 <div class="stat"><span>Year</span><b id="year">—</b></div>
 <div class="stat"><span>Day</span><b id="day">—</b></div>
 <div class="stat"><span>Moons</span><b id="moons">—</b></div>
 <h3>About</h3><p id="about"></p>
 <button id="focusBtn" style="width:100%">🎯 Focus on Object</button>
</div>

<div id="bottom" class="panel">
 <button id="pause">⏸ Pause</button>
 <button id="reverse">↶ Reverse</button>
 <button id="faster">⏩ Faster</button>
 <button id="slower">⏪ Slower</button>
 <span class="bottomText">&nbsp; Time: <b id="timeLabel">1×</b> &nbsp; | &nbsp; Drag = orbit camera • Wheel = zoom • Click = select</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x01030a);
scene.fog=new THREE.Fog(0x01030a,260,1000);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,3000);
camera.position.set(0,120,260);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.getElementById("app").appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x52627d,.35));
const sunLight=new THREE.PointLight(0xffffff,3.5,0,2);
sunLight.position.set(0,0,0);scene.add(sunLight);

function stars(){
 const geo=new THREE.BufferGeometry(), a=[];
 for(let i=0;i<4500;i++){
   const r=THREE.MathUtils.randFloat(500,1300);
   const t=Math.random()*Math.PI*2, p=Math.acos(THREE.MathUtils.randFloatSpread(2));
   a.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));
 }
 geo.setAttribute("position",new THREE.Float32BufferAttribute(a,3));
 scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:1.25,sizeAttenuation:true})));
}
stars();

const data=[
{name:"Mercury",type:"Rocky planet",r:.9,orbit:13,size:2.2,color:0xaaa08f,year:"88 days",day:"58.6 days",moons:"0",diameter:"4,879 km",about:"The smallest planet and the closest to the Sun. Its surface is heavily cratered and its temperature varies dramatically."},
{name:"Venus",type:"Rocky planet",r:1.35,orbit:19,size:3.5,color:0xd8a96b,year:"224.7 days",day:"243 days",moons:"0",diameter:"12,104 km",about:"A hot, cloud-covered world with a dense carbon-dioxide atmosphere. Venus rotates very slowly and in the opposite direction from most planets."},
{name:"Earth",type:"Rocky planet • Home",r:1.7,orbit:27,size:3.8,color:0x3d8ed0,year:"365.25 days",day:"23.9 hours",moons:"1",diameter:"12,742 km",about:"Our home world, with liquid surface water, a nitrogen-rich atmosphere and life. The Moon is its natural satellite."},
{name:"Mars",type:"Rocky planet",r:2.25,orbit:35,size:3.0,color:0xb84e32,year:"687 days",day:"24.6 hours",moons:"2",diameter:"6,779 km",about:"A cold desert world with volcanoes, canyons and polar ice. Robotic missions study its geology and search for clues about its ancient environment."},
{name:"Jupiter",type:"Gas giant",r:3.2,orbit:52,size:10,color:0xc7a77f,year:"11.86 years",day:"9.9 hours",moons:"95+",diameter:"139,820 km",about:"The largest planet. Its atmosphere contains enormous storms, including the Great Red Spot, and it has a powerful magnetic environment."},
{name:"Saturn",type:"Gas giant",r:4.05,orbit:70,size:8.5,color:0xd7b987,year:"29.45 years",day:"10.7 hours",moons:"140+",diameter:"116,460 km",about:"A giant planet famous for its spectacular rings. The rings are made mostly of water ice and rocky material."},
{name:"Uranus",type:"Ice giant",r:5.0,orbit:88,size:6.2,color:0x79cbd0,year:"84 years",day:"17.2 hours",moons:"27",diameter:"50,724 km",about:"A pale blue-green ice giant. Its extreme axial tilt gives it unusual seasons, and it has a faint ring system."},
{name:"Neptune",type:"Ice giant",r:5.7,orbit:106,size:6.0,color:0x4169c1,year:"164.8 years",day:"16.1 hours",moons:"16",diameter:"49,244 km",about:"The most distant major planet. Neptune has deep blue clouds and some of the fastest winds measured in the Solar System."}
];

const objects={}, orbitGroups=[];
const sunGeo=new THREE.SphereGeometry(7,48,32);
const sunMat=new THREE.MeshBasicMaterial({color:0xffc45a});
const sun=new THREE.Mesh(sunGeo,sunMat);scene.add(sun);
const glow=new THREE.Mesh(new THREE.SphereGeometry(9,32,24),new THREE.MeshBasicMaterial({color:0xffa42e,transparent:true,opacity:.13,side:THREE.BackSide}));
scene.add(glow);

function orbitLine(rad){
 const pts=[];
 for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad))}
 const g=new THREE.BufferGeometry().setFromPoints(pts);
 const m=new THREE.LineBasicMaterial({color:0x52627c,transparent:true,opacity:.3});
 return new THREE.Line(g,m);
}

function makeLabel(text){
 const c=document.createElement("canvas"),ctx=c.getContext("2d");
 c.width=256;c.height=64;ctx.font="bold 26px Arial";ctx.fillStyle="#ffffff";ctx.textAlign="center";ctx.fillText(text,128,40);
 const tex=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
 sp.scale.set(15,3.75,1);return sp;
}

data.forEach((d,i)=>{
 const orbit=orbitLine(d.orbit);scene.add(orbit);orbitGroups.push(orbit);
 const g=new THREE.Group();g.userData={data:d,angle:Math.random()*Math.PI*2};
 const geo=new THREE.SphereGeometry(d.size,32,22);
 const material=new THREE.MeshStandardMaterial({color:d.color,roughness:.9,metalness:.02});
 const mesh=new THREE.Mesh(geo,material);mesh.castShadow=true;g.add(mesh);
 if(d.name==="Saturn"){
   const rm=new THREE.MeshBasicMaterial({color:0xbca77d,side:THREE.DoubleSide,transparent:true,opacity:.72});
   const rg=new THREE.RingGeometry(10,15,96);const ring=new THREE.Mesh(rg,rm);ring.rotation.x=Math.PI/2.35;g.add(ring);
 }
 if(d.name==="Earth"){
   const moon=new THREE.Mesh(new THREE.SphereGeometry(.7,20,14),new THREE.MeshStandardMaterial({color:0xbec1c5}));
   moon.position.set(6,0,0);g.add(moon);
 }
 const label=makeLabel(d.name);label.position.y=d.size+4;g.add(label);
 g.position.set(Math.cos(g.userData.angle)*d.orbit,0,Math.sin(g.userData.angle)*d.orbit);
 scene.add(g);objects[d.name]=g;
});

const list=document.getElementById("planetList");
data.forEach(d=>{
 const b=document.createElement("button");b.className="planetBtn";b.innerHTML=`<strong>● ${d.name}</strong><span>${d.type}</span>`;
 b.onclick=()=>select(d.name);list.appendChild(b);
});

let selected=null, paused=false, speed=1, showOrbits=true, showLabels=true;
let camTarget=new THREE.Vector3(0,0,0),camDistance=280,camYaw=0,camPitch=.35;
let dragging=false,lastX=0,lastY=0;

function select(name){
 selected=name;const d=data.find(x=>x.name===name);const o=objects[name];
 document.getElementById("right").style.display="block";
 document.getElementById("infoName").textContent=d.name;
 document.getElementById("infoType").textContent=d.type;
 document.getElementById("diameter").textContent=d.diameter;
 document.getElementById("year").textContent=d.year;
 document.getElementById("day").textContent=d.day;
 document.getElementById("moons").textContent=d.moons;
 document.getElementById("about").textContent=d.about;
 camTarget.copy(o.position);
 camDistance=Math.max(d.size*7,28);
}
document.getElementById("close").onclick=()=>document.getElementById("right").style.display="none";
document.getElementById("focusBtn").onclick=()=>{if(selected)select(selected)};

document.getElementById("homeBtn").onclick=()=>{
 selected=null;camTarget.set(0,0,0);camDistance=280;camYaw=0;camPitch=.35;
 document.getElementById("right").style.display="none";
};
document.getElementById("orbitsBtn").onclick=()=>{
 showOrbits=!showOrbits;orbitGroups.forEach(x=>x.visible=showOrbits);
 document.getElementById("orbitsBtn").textContent=showOrbits?"◉ Hide Orbits":"◉ Show Orbits";
};
document.getElementById("labelsBtn").onclick=()=>{
 showLabels=!showLabels;Object.values(objects).forEach(o=>o.children.forEach(c=>{if(c.isSprite)c.visible=showLabels}));
 document.getElementById("labelsBtn").textContent=showLabels?"🏷️ Hide Labels":"🏷️ Show Labels";
};
document.getElementById("pause").onclick=()=>{
 paused=!paused;document.getElementById("pause").textContent=paused?"▶ Resume":"⏸ Pause";
};
document.getElementById("reverse").onclick=()=>speed*=-1;
document.getElementById("faster").onclick=()=>speed=Math.max(-12,Math.min(12,speed*1.8||1));
document.getElementById("slower").onclick=()=>speed=speed/1.8;
document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();document.querySelectorAll(".planetBtn").forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?"flex":"none");
});

renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointermove",e=>{
 if(!dragging)return;
 camYaw-=(e.clientX-lastX)*.006;camPitch-=(e.clientY-lastY)*.004;
 camPitch=THREE.MathUtils.clamp(camPitch,-1.2,1.2);lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener("wheel",e=>{
 camDistance*=Math.pow(1.0018,e.deltaY);camDistance=THREE.MathUtils.clamp(camDistance,10,1000);
});
renderer.domElement.addEventListener("click",e=>{
 const rect=renderer.domElement.getBoundingClientRect();
 const mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
 const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);
 const meshes=[];Object.values(objects).forEach(o=>meshes.push(...o.children.filter(c=>c.isMesh)));
 const hit=ray.intersectObjects(meshes,true)[0];
 if(hit){
   let p=hit.object;while(p.parent&&!p.userData.data)p=p.parent;
   if(p.userData.data)select(p.userData.data.name);
 }
});

function animate(t){
 requestAnimationFrame(animate);
 const dt=.001*(paused?0:speed);
 data.forEach(d=>{
   const o=objects[d.name];o.userData.angle+=dt*(25/d.orbit);
   o.position.set(Math.cos(o.userData.angle)*d.orbit,0,Math.sin(o.userData.angle)*d.orbit);
   o.rotation.y+=.003;
 });
 if(selected){camTarget.lerp(objects[selected].position,.045)}
 const cp=Math.cos(camPitch),sp=Math.sin(camPitch);
 const desired=new THREE.Vector3(
   camTarget.x+Math.sin(camYaw)*cp*camDistance,
   camTarget.y+sp*camDistance,
   camTarget.z+Math.cos(camYaw)*cp*camDistance
 );
 camera.position.lerp(desired,.08);camera.lookAt(camTarget);
 sun.rotation.y+=.001;glow.scale.setScalar(1+Math.sin(t*.002)*.025);
 document.getElementById("timeLabel").textContent=(speed===0?"0":speed.toFixed(1).replace(".0",""))+"×";
 renderer.render(scene,camera);
}
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
setTimeout(()=>document.getElementById("loading").style.display="none",700);
animate(0);
</script>
</body>
</html>
