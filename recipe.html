<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APEX Star Gamer - Minecraft Recipes</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0b0b;
            color: white;
        }

        /* HEADER */

        header {
            background: linear-gradient(90deg, #111, #168000, #111);
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 0 20px #18ff00;
        }

        header h1 {
            font-size: 38px;
            text-shadow: 0 0 10px #18ff00;
        }

        header p {
            margin-top: 8px;
            color: #ddd;
        }

        /* SEARCH */

        .search-box {
            width: 90%;
            max-width: 700px;
            margin: 35px auto;
            display: flex;
        }

        .search-box input {
            width: 100%;
            padding: 17px;
            border: 2px solid #18a800;
            border-radius: 12px 0 0 12px;
            background: #171717;
            color: white;
            outline: none;
            font-size: 17px;
        }

        .search-box button {
            padding: 0 25px;
            border: none;
            background: #168000;
            color: white;
            font-size: 17px;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #20b000;
        }

        /* CATEGORIES */

        .categories {
            text-align: center;
            margin-bottom: 25px;
        }

        .categories button {
            padding: 10px 18px;
            margin: 5px;
            border: 1px solid #168000;
            border-radius: 20px;
            background: #151515;
            color: white;
            cursor: pointer;
        }

        .categories button:hover,
        .categories button.active {
            background: #168000;
        }

        /* CONTAINER */

        .container {
            width: 92%;
            max-width: 1250px;
            margin: auto;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* CARD */

        .card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #20c000;
            box-shadow: 0 0 18px rgba(24, 255, 0, 0.35);
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #222;
        }

        .card-content {
            padding: 18px;
        }

        .card h2 {
            color: #35d51b;
            margin-bottom: 8px;
        }

        .card p {
            color: #bbb;
            margin-bottom: 8px;
        }

        .edition {
            display: inline-block;
            background: #222;
            color: #70ff5c;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* RECIPE */

        .recipe-title {
            color: white;
            margin-bottom: 10px;
        }

        .recipe {
            width: 180px;
            margin: 15px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .slot {
            height: 50px;
            background: #292929;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            text-align: center;
            padding: 3px;
            color: #ddd;
        }

        .slot.item {
            background: #193019;
            border-color: #329b2b;
            color: #8cff7b;
        }

        .result {
            margin-top: 15px;
            background: #050505;
            border: 1px dashed #20c000;
            padding: 12px;
            border-radius: 8px;
            color: #00ff88;
            text-align: center;
            font-weight: bold;
        }

        .materials {
            margin-top: 15px;
            background: #101010;
            padding: 12px;
            border-radius: 8px;
        }

        .materials strong {
            color: #35d51b;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            background: #168000;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .copy-btn:hover {
            background: #20b000;
        }

        /* NO RESULT */

        #noResult {
            display: none;
            text-align: center;
            padding: 50px;
            color: #ff4444;
            font-size: 22px;
        }

        /* FOOTER */

        footer {
            background: #111;
            text-align: center;
            padding: 25px;
            border-top: 1px solid #333;
        }

        footer span {
            color: #20c000;
            font-weight: bold;
        }

        /* MOBILE */

        @media(max-width:600px) {

            header h1 {
                font-size: 28px;
            }

            .search-box {
                width: 94%;
            }

            .card-image {
                height: 160px;
            }

        }

    </style>

</head>

    /*
    ==========================================
    CREATE RECIPE CARDS
    ==========================================
    */

    function loadRecipes() {

        const grid = document.getElementById("recipeGrid");

        grid.innerHTML = "";

        recipes.forEach(function(item, index) {

            const card = document.createElement("div");

            card.className = "card";

            card.dataset.category = item.category;
            card.dataset.name = item.name.toLowerCase();
            card.dataset.materials = item.materials.toLowerCase();

            let recipeHTML = "";

            item.grid.forEach(function(slot) {

                if (slot === "") {

                    recipeHTML += `
                        <div class="slot"></div>
                    `;

                } else {

                    recipeHTML += `
                        <div class="slot item">
                            ${slot}
                        </div>
                    `;

                }

            });


            card.innerHTML = `

                <img
                    class="card-image"
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="card-content">

                    <h2>${item.name}</h2>

                    <p>
                        Category: ${item.category}
                    </p>

                    <span class="edition">
                        ${item.edition}
                    </span>

                    <h3 class="recipe-title">
                        Crafting Recipe
                    </h3>

                    <div class="recipe">
                        ${recipeHTML}
                    </div>

                    <div class="result">
                        Result: ${item.result}
                    </div>

                    <div class="materials">
                        <strong>Materials:</strong><br>
                        ${item.materials}
                    </div>

                    <button
                        class="copy-btn"
                        onclick="copyRecipe(${index})"
                    >
                        Copy Recipe
                    </button>

                </div>

            `;

            grid.appendChild(card);

        });

    }


    /*
    ==========================================
    SEARCH
    ==========================================
    */

    function searchRecipes() {

        let input = document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

        let cards = document.querySelectorAll(".card");

        let found = 0;


        cards.forEach(function(card) {

            let name = card.dataset.name;
            let materials = card.dataset.materials;
            let category = card.dataset.category;


            let searchMatch =
                name.includes(input) ||
                materials.includes(input);


            let categoryMatch =
                currentCategory === "all" ||
                category === currentCategory;


            if (searchMatch && categoryMatch) {

                card.style.display = "block";

                found++;

            } else {

                card.style.display = "none";

            }

        });


        if (found === 0) {

            document.getElementById("noResult").style.display =
                "block";

        } else {

            document.getElementById("noResult").style.display =
                "none";

        }

    }


    /*
    ==========================================
    CATEGORY FILTER
    ==========================================
    */

    function filterCategory(category, button) {

        currentCategory = category;


        document
            .querySelectorAll(".categories button")
            .forEach(function(btn) {

                btn.classList.remove("active");

            });


        button.classList.add("active");

        searchRecipes();

    }


    /*
    ==========================================
    COPY RECIPE
    ==========================================
    */

    function copyRecipe(index) {

        const item = recipes[index];

        const text =
`Minecraft Recipe

Item: ${item.name}

Edition: ${item.edition}

Result: ${item.result}

Materials:
${item.materials}`;


        navigator.clipboard.writeText(text)
            .then(function() {

                alert(
                    item.name +
                    " recipe copied!"
                );

            })
            .catch(function() {

                alert(text);

            });

    }


    /*
    ==========================================
    START WEBSITE
    ==========================================
    */

    loadRecipes();

</script>

</body>
</html>
