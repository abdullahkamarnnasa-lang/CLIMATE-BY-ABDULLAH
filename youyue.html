            background: red;

            border: 1px solid red;
            border-radius: 20px;
            background: #151515;
            color: white;
            cursor: pointer;
        }

            background: red;
        }

        /* GRID */
        .container {
            width: 92%;
            max-width: 1200px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* CARD */
        .card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: red;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.5);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #222;
        }

        .card-content {
            padding: 18px;
        }

        .card h2 {
            color: #ff3333;
            margin-bottom: 8px;
        }

        .card p {
            color: #bbb;
            margin-bottom: 12px;
        }

        .code {
            background: #050505;
            border: 1px dashed red;
            padding: 12px;
            border-radius: 8px;
            color: #00ff88;
            font-size: 20px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: red;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        }

            padding: 50px;
            color: #ff4444;

        /*
        ==========================================
        CREATE ALL CARDS AUTOMATICALLY
        ==========================================
        */

        function loadCodes() {

            const grid = document.getElementById("codeGrid");

            grid.innerHTML = "";

            cheatCodes.forEach(function(item) {

                const card = document.createElement("div");

                card.className = "card";

                card.dataset.category = item.category;
                card.dataset.name = item.name.toLowerCase();
                card.dataset.code = item.code.toLowerCase();

                card.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="card-content">

                        <h2>${item.name}</h2>

                        <p>Category: ${item.type}</p>

                        <div class="code">
                            ${item.code}
                        </div>

                        <button
                            class="copy-btn"
                            onclick="copyCode('${item.code}')"
                        >
                            Copy Cheat Code
                        </button>

                    </div>

                `;

                grid.appendChild(card);

            });

        }


        /*
        ==========================================
        SEARCH FUNCTION
        ==========================================
        */

        function searchCodes() {

            let input = document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();

            let cards = document.querySelectorAll(".card");

            let found = 0;


            cards.forEach(function(card) {

                let name = card.dataset.name;
                let code = card.dataset.code;
                let category = card.dataset.category;


                let searchMatch =
                    name.includes(input) ||
                    code.includes(input);


                let categoryMatch =
                    currentCategory === "all" ||
                    category === currentCategory;


                if (searchMatch && categoryMatch) {

                    card.style.display = "block";

                    found++;

                } else {

                    card.style.display = "none";

                }

            });


            if (found === 0) {

                document.getElementById("noResult").style.display = "block";

            } else {

                document.getElementById("noResult").style.display = "none";

            }

        }


        /*
        ==========================================
        CATEGORY FILTER
        ==========================================
        */

        function filterCategory(category, button) {

            currentCategory = category;


            document
                .querySelectorAll(".categories button")
                .forEach(function(btn) {

                    btn.classList.remove("active");

                });


            button.classList.add("active");

            searchCodes();

        }


        /*
        ==========================================
        COPY CODE
        ==========================================
        */

        function copyCode(code) {

            navigator.clipboard.writeText(code)
                .then(function() {

                    alert("Cheat code copied: " + code);

                })
                .catch(function() {

                    alert("Cheat code: " + code);

                });

        }


        /*
        ==========================================
        LOAD WEBSITE
        ==========================================
        */

        loadCodes();

    </script>
